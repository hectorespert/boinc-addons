name: Build Add-ons

on:
  workflow_call:
    inputs:
      changed_addons:
        description: 'JSON array of add-ons to build'
        required: true
        type: string
      test_mode:
        description: 'Build in test mode (do not publish)'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    name: Prepare ${{ matrix.addon }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: ${{ fromJson(inputs.changed_addons) }}
    outputs:
      build_matrix: ${{ steps.combine.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Normalize add-on information
        id: normalize
        run: |
          image=${{ steps.info.outputs.image }}
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          version=${{ steps.info.outputs.version }}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          name=${{ steps.info.outputs.name }}
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          description=${{ steps.info.outputs.description }}
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          url=${{ steps.info.outputs.url }}
          if [[ -n "$url" && "$url" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

      - name: Combine matrix with addon metadata
        id: combine
        run: |
          MATRIX='${{ steps.matrix.outputs.matrix }}'
          ADDON='${{ matrix.addon }}'
          VERSION='${{ steps.normalize.outputs.version }}'
          NAME='${{ steps.normalize.outputs.name }}'
          DESCRIPTION='${{ steps.normalize.outputs.description }}'
          URL='${{ steps.normalize.outputs.url }}'
          IMAGE_NAME='${{ steps.normalize.outputs.image_name }}'
          REGISTRY_PREFIX='${{ steps.normalize.outputs.registry_prefix }}'
          ARCHITECTURES='${{ steps.info.outputs.architectures }}'

          # Add addon metadata to each matrix entry
          ENHANCED_MATRIX=$(echo "$MATRIX" | jq -c \
            --arg addon "$ADDON" \
            --arg version "$VERSION" \
            --arg name "$NAME" \
            --arg description "$DESCRIPTION" \
            --arg url "$URL" \
            --arg image_name "$IMAGE_NAME" \
            --arg registry_prefix "$REGISTRY_PREFIX" \
            --arg architectures "$ARCHITECTURES" \
            '.include |= map(. + {addon: $addon, version: $version, name: $name, description: $description, url: $url, image_name: $image_name, registry_prefix: $registry_prefix, architectures: $architectures})')

          echo "matrix=$ENHANCED_MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Build ${{ matrix.addon }} add-on
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          context: "./${{ matrix.addon }}"
          image-tags: |
            ${{ matrix.version }}
            latest
          labels: |
            io.hass.type=addon
            io.hass.name=${{ matrix.name }}
            io.hass.description=${{ matrix.description }}
            ${{ matrix.url && format('io.hass.url={0}', matrix.url) || '' }}
          version: ${{ matrix.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ inputs.test_mode == false && 'true' || 'false' }}
          load: ${{ inputs.test_mode == true && 'true' || 'false' }}
          cosign: ${{ inputs.test_mode == false && 'true' || 'false' }}

      - name: Test boinc add-on
        if: matrix.addon == 'boinc'
        working-directory: boinc
        run: |
          if [[ "${{ inputs.test_mode }}" == "true" ]]; then
            IMAGE_TAG="${{ matrix.image }}:latest"
          else
            IMAGE_TAG="${{ matrix.image }}:${{ matrix.version }}"
          fi

          docker run --uts=host --pid=host --rm \
            -v boinc_test_${{ matrix.arch }}:/data \
            -v $(pwd)/operator/options.json:/data/options.json:ro \
            "${IMAGE_TAG}" \
            --log-level DEBUG \
            --exit-immediately true

  manifest:
    name: Publish ${{ matrix.addon }} multi-arch manifest
    if: ${{ inputs.test_mode == false }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    strategy:
      matrix:
        addon: ${{ fromJson(inputs.changed_addons) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Normalize image information
        id: normalize
        run: |
          image=${{ steps.info.outputs.image }}
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"

      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          image-tags: |
            ${{ fromJson(steps.info.outputs.version) }}
            latest
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

      - name: Verify multi-arch manifest
        run: |
          IMAGE="${{ steps.normalize.outputs.registry_prefix }}/${{ steps.normalize.outputs.image_name }}:${{ fromJson(steps.info.outputs.version) }}"
          echo "Inspecting manifest for ${IMAGE}"
          docker buildx imagetools inspect "${IMAGE}"

          EXPECTED_ARCHS='${{ steps.info.outputs.architectures }}'
          for arch in $(echo "${EXPECTED_ARCHS}" | jq -r '.[]'); do
            case "${arch}" in
              amd64)    platform="linux/amd64" ;;
              aarch64)  platform="linux/arm64" ;;
              *)        echo "::warning::Unknown arch ${arch}, skipping check"; continue ;;
            esac

            if docker buildx imagetools inspect "${IMAGE}" --raw | jq -e ".manifests[] | select(.platform.os == \"linux\" and .platform.architecture == \"${platform#linux/}\")" > /dev/null 2>&1; then
              echo "✅ ${platform} found in manifest"
            else
              echo "::error::${platform} not found in manifest for ${IMAGE}"
              exit 1
            fi
          done
