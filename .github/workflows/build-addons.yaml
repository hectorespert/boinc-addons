name: Build Add-on

on:
  workflow_call:
    inputs:
      addon:
        description: 'Add-on directory to build'
        required: true
        type: string
      publish:
        description: 'Whether to publish images to registry'
        required: true
        type: boolean

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.addon }}"

      - name: Normalize add-on information
        id: normalize
        run: |
          image=${{ steps.info.outputs.image }}
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          version=${{ steps.info.outputs.version }}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          name=${{ steps.info.outputs.name }}
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          description=${{ steps.info.outputs.description }}
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          url=${{ steps.info.outputs.url }}
          if [[ -n "$url" && "$url" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} ${{ inputs.addon }} add-on
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Build add-on image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.addon }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=addon
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish }}
          load: ${{ inputs.publish == false }}
          cosign: ${{ inputs.publish }}
          version: ${{ needs.prepare.outputs.version }}

      - name: Test boinc add-on
        if: inputs.addon == 'boinc'
        working-directory: boinc
        run: |
          if [[ "${{ inputs.publish }}" == "false" ]]; then
            IMAGE_TAG="${{ matrix.image }}:latest"
          else
            IMAGE_TAG="${{ matrix.image }}:${{ needs.prepare.outputs.version }}"
          fi

          docker run --uts=host --pid=host --rm \
            -v boinc_test_${{ matrix.arch }}:/data \
            -v $(pwd)/operator/options.json:/data/options.json:ro \
            "${IMAGE_TAG}" \
            --log-level DEBUG \
            --exit-immediately

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}

      - name: Verify multi-arch manifest
        run: |
          IMAGE="${{ needs.prepare.outputs.registry_prefix }}/${{ needs.prepare.outputs.image_name }}:${{ needs.prepare.outputs.version }}"
          echo "Inspecting manifest for ${IMAGE}"
          docker buildx imagetools inspect "${IMAGE}"

          EXPECTED_ARCHS='${{ needs.prepare.outputs.architectures }}'
          for arch in $(echo "${EXPECTED_ARCHS}" | jq -r '.[]'); do
            case "${arch}" in
              amd64)    platform="linux/amd64" ;;
              aarch64)  platform="linux/arm64" ;;
              *)        echo "::warning::Unknown arch ${arch}, skipping check"; continue ;;
            esac

            if docker buildx imagetools inspect "${IMAGE}" --raw | jq -e ".manifests[] | select(.platform.os == \"linux\" and .platform.architecture == \"${platform#linux/}\")" > /dev/null 2>&1; then
              echo "✅ ${platform} found in manifest"
            else
              echo "::error::${platform} not found in manifest for ${IMAGE}"
              exit 1
            fi
          done
