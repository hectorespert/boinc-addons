name: Build Add-ons

on:
  workflow_call:
    inputs:
      changed_addons:
        description: 'JSON array of add-ons to build'
        required: true
        type: string
      test_mode:
        description: 'Build in test mode (do not publish)'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.aggregate.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Build combined matrix for all add-ons
        id: aggregate
        run: |
          CHANGED_ADDONS='${{ inputs.changed_addons }}'
          COMBINED_INCLUDES="[]"

          for ADDON in $(echo "$CHANGED_ADDONS" | jq -r '.[]'); do
            echo "::group::Processing ${ADDON}"

            # Get add-on information using config.yaml
            CONFIG="./${ADDON}/config.yaml"
            BUILD_CONFIG="./${ADDON}/build.yaml"

            # Extract info from config.yaml
            VERSION=$(yq e '.version' "$CONFIG")
            NAME=$(yq e '.name' "$CONFIG")
            DESCRIPTION=$(yq e '.description' "$CONFIG")
            URL=$(yq e '.url // ""' "$CONFIG")
            IMAGE=$(yq e '.image' "$CONFIG")
            ARCHITECTURES=$(yq e '.arch' "$CONFIG" -o=json)

            IMAGE_NAME="${IMAGE##*/}"
            REGISTRY_PREFIX="${IMAGE%/*}"

            if [[ -z "$URL" || "$URL" == "null" ]]; then
              URL=""
            fi

            # Build matrix entries for each architecture
            for ARCH in $(echo "$ARCHITECTURES" | jq -r '.[]'); do
              case "${ARCH}" in
                amd64)    OS="ubuntu-latest" ; PLATFORM="linux/amd64" ;;
                aarch64)  OS="ubuntu-latest" ; PLATFORM="linux/arm64" ;;
                *)        echo "::warning::Unknown arch ${ARCH}, skipping"; continue ;;
              esac

              IMAGE_TAG="${REGISTRY_PREFIX}/${IMAGE_NAME}"

              ENTRY=$(jq -nc \
                --arg arch "$ARCH" \
                --arg os "$OS" \
                --arg image "$IMAGE_TAG" \
                --arg addon "$ADDON" \
                --arg version "$VERSION" \
                --arg name "$NAME" \
                --arg description "$DESCRIPTION" \
                --arg url "$URL" \
                --arg image_name "$IMAGE_NAME" \
                --arg registry_prefix "$REGISTRY_PREFIX" \
                --arg architectures "$ARCHITECTURES" \
                '{arch: $arch, os: $os, image: $image, addon: $addon, version: $version, name: $name, description: $description, url: $url, image_name: $image_name, registry_prefix: $registry_prefix, architectures: $architectures}')

              COMBINED_INCLUDES=$(echo "$COMBINED_INCLUDES" | jq -c --argjson entry "$ENTRY" '. + [$entry]')
            done

            echo "::endgroup::"
          done

          MATRIX=$(jq -nc --argjson includes "$COMBINED_INCLUDES" '{include: $includes}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Combined matrix: $MATRIX"

  build:
    name: Build ${{ matrix.addon }} add-on (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Build ${{ matrix.addon }} add-on
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          context: "./${{ matrix.addon }}"
          image-tags: |
            ${{ matrix.version }}
            latest
          labels: |
            io.hass.type=addon
            io.hass.name=${{ matrix.name }}
            io.hass.description=${{ matrix.description }}
            ${{ matrix.url && format('io.hass.url={0}', matrix.url) || '' }}
          version: ${{ matrix.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ inputs.test_mode == false && 'true' || 'false' }}
          load: ${{ inputs.test_mode == true && 'true' || 'false' }}
          cosign: ${{ inputs.test_mode == false && 'true' || 'false' }}

      - name: Test boinc add-on
        if: matrix.addon == 'boinc'
        working-directory: boinc
        run: |
          if [[ "${{ inputs.test_mode }}" == "true" ]]; then
            IMAGE_TAG="${{ matrix.image }}:latest"
          else
            IMAGE_TAG="${{ matrix.image }}:${{ matrix.version }}"
          fi

          docker run --uts=host --pid=host --rm \
            -v boinc_test_${{ matrix.arch }}:/data \
            -v $(pwd)/operator/options.json:/data/options.json:ro \
            "${IMAGE_TAG}" \
            --log-level DEBUG \
            --exit-immediately true

  manifest:
    name: Publish multi-arch manifest (${{ matrix.addon }})
    if: ${{ inputs.test_mode == false }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    strategy:
      matrix:
        addon: ${{ fromJson(inputs.changed_addons) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Normalize image information
        id: normalize
        run: |
          image=${{ steps.info.outputs.image }}
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"

      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          image-tags: |
            ${{ fromJson(steps.info.outputs.version) }}
            latest
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

      - name: Verify multi-arch manifest
        run: |
          IMAGE="${{ steps.normalize.outputs.registry_prefix }}/${{ steps.normalize.outputs.image_name }}:${{ fromJson(steps.info.outputs.version) }}"
          echo "Inspecting manifest for ${IMAGE}"
          docker buildx imagetools inspect "${IMAGE}"

          EXPECTED_ARCHS='${{ steps.info.outputs.architectures }}'
          for arch in $(echo "${EXPECTED_ARCHS}" | jq -r '.[]'); do
            case "${arch}" in
              amd64)    platform="linux/amd64" ;;
              aarch64)  platform="linux/arm64" ;;
              *)        echo "::warning::Unknown arch ${arch}, skipping check"; continue ;;
            esac

            if docker buildx imagetools inspect "${IMAGE}" --raw | jq -e ".manifests[] | select(.platform.os == \"linux\" and .platform.architecture == \"${platform#linux/}\")" > /dev/null 2>&1; then
              echo "✅ ${platform} found in manifest"
            else
              echo "::error::${platform} not found in manifest for ${IMAGE}"
              exit 1
            fi
          done
