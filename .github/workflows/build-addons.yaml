name: Build Add-ons

on:
  workflow_call:
    inputs:
      changed_addons:
        description: 'JSON array of add-ons to build'
        required: true
        type: string
      test_mode:
        description: 'Build in test mode (do not publish)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(inputs.changed_addons) }}
        arch: ["aarch64", "amd64"]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if add-on should be built
        id: check
        run: |
          if [[ "${{ steps.info.outputs.architectures }}" =~ ${{ matrix.arch }} ]]; then
             echo "build_arch=true" >> $GITHUB_OUTPUT;
             image="${{ steps.info.outputs.image }}"
             # Replace {arch} placeholder with the actual architecture
             image="${image//\{arch\}/${{ matrix.arch }}}"
             echo "image=$image" >> $GITHUB_OUTPUT;
           else
             echo "${{ matrix.arch }} is not a valid arch for ${{ matrix.addon }}, skipping build";
             echo "build_arch=false" >> $GITHUB_OUTPUT;
          fi

      - name: Build ${{ matrix.addon }} add-on
        if: steps.check.outputs.build_arch == 'true'
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ steps.check.outputs.image }}
          file: ${{ matrix.addon }}/Dockerfile
          context: ${{ matrix.addon }}
          image-tags: |
            ${{ fromJson(steps.info.outputs.version) }}
            latest
          version: ${{ fromJson(steps.info.outputs.version) }}
          container-registry: ghcr.io
          container-registry-username: ${{ github.repository_owner }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ inputs.test_mode == false && 'true' || 'false' }}
          load: ${{ inputs.test_mode == true && 'true' || 'false' }}
          cosign: ${{ inputs.test_mode == false && 'true' || 'false' }}

      - name: Test boinc add-on
        if: matrix.addon == 'boinc' && steps.check.outputs.build_arch == 'true'
        working-directory: boinc
        run: |
          if [[ "${{ inputs.test_mode }}" == "true" ]]; then
            IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-boinc:latest"
          else
            IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-boinc:${{ steps.info.outputs.version }}"
          fi

          docker run --uts=host --pid=host --rm \
            -v boinc_test_${{ matrix.arch }}:/data \
            -v $(pwd)/operator/options.json:/data/options.json:ro \
            "${IMAGE_TAG}" \
            --log-level DEBUG \
            --exit-immediately true

  manifest:
    name: Publish ${{ matrix.addon }} multi-arch manifest
    if: ${{ inputs.test_mode == false }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    strategy:
      matrix:
        addon: ${{ fromJson(inputs.changed_addons) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Get image name
        id: image
        run: |
          image="${{ steps.info.outputs.image }}"
          # Remove {arch}- prefix to get the base image name
          image_name="${image//\{arch\}-/}"
          # Remove registry prefix to get just the name
          image_name="${image_name#ghcr.io/${{ github.repository_owner }}/}"
          echo "name=$image_name" >> $GITHUB_OUTPUT

      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ steps.image.outputs.name }}
          image-tags: |
            ${{ fromJson(steps.info.outputs.version) }}
            latest

      - name: Verify multi-arch manifest
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:${{ fromJson(steps.info.outputs.version) }}"
          echo "Inspecting manifest for ${IMAGE}"
          docker buildx imagetools inspect "${IMAGE}"

          EXPECTED_ARCHS='${{ steps.info.outputs.architectures }}'
          for arch in $(echo "${EXPECTED_ARCHS}" | jq -r '.[]'); do
            case "${arch}" in
              amd64)    platform="linux/amd64" ;;
              aarch64)  platform="linux/arm64" ;;
              *)        echo "::warning::Unknown arch ${arch}, skipping check"; continue ;;
            esac

            if docker buildx imagetools inspect "${IMAGE}" --raw | jq -e ".manifests[] | select(.platform.os == \"linux\" and .platform.architecture == \"${platform#linux/}\")" > /dev/null 2>&1; then
              echo "✅ ${platform} found in manifest"
            else
              echo "::error::${platform} not found in manifest for ${IMAGE}"
              exit 1
            fi
          done
