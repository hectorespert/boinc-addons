name: Find Changed Add-ons

on:
  workflow_call:
    inputs:
      monitored_files:
        description: 'Files to monitor for changes'
        required: false
        type: string
        default: 'build.yaml config.yaml Dockerfile'
    outputs:
      changed_addons:
        description: 'JSON array of changed add-ons'
        value: ${{ jobs.init.outputs.changed_addons }}
      changed:
        description: 'Whether any add-ons changed'
        value: ${{ jobs.init.outputs.changed }}

jobs:
  init:
    runs-on: ubuntu-latest
    name: Find changed add-ons
    outputs:
      changed_addons: ${{ steps.filter.outputs.addons }}
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.0

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed add-ons
        id: filter
        env:
          ADDONS: ${{ steps.addons.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
          MONITORED_FILES: ${{ inputs.monitored_files }}
        run: |
          changed_addons=()

          for addon in ${ADDONS}; do
            for file in ${MONITORED_FILES}; do
              if [[ "${CHANGED_FILES}" =~ ${addon}/${file} ]]; then
                changed_addons+=("${addon}")
                break
              fi
            done
          done

          if [[ ${#changed_addons[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "addons=$(jq -nc '$ARGS.positional' --args "${changed_addons[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
