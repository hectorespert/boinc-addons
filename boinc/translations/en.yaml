configuration:
  projects:
    name: Projects
    description: "The science projects to compute for, each with its address and your account key for it. Cannot be combined with the account manager options; setting both stops the app from starting"
  gui_rpc_password:
    name: "GUI RPC password"
    description: "Password to control this BOINC client remotely, e.g. from boinctui. Set one if you plan to connect remotely — see the app documentation for what leaving it empty does"
  remote_hosts:
    name: Remote hosts
    description: List of remote hosts to allow remote connection
  allow_remote_gui_rpc:
    name: Allow remote GUI RPC
    description: Allow all remote GUI RPC connections (overrides remote hosts)
  account_manager_url:
    name: Account Manager URL
    description: "A URL for a BOINC Account Manager, e.g. https://scienceunited.org. Set all three account manager options together, or leave all three empty — setting only some stops the app from starting"
  account_manager_username:
    name: Account Manager Username
    description: "A username for a user registered in the BOINC Account Manager. Required together with the other two account manager options, or the app will not start"
  account_manager_password:
    name: Account Manager Password
    description: "Password for the configured user in the BOINC Account Manager. Required together with the other two account manager options, or the app will not start"
  start_hour:
    name: Start Hour
    description: "Configure the hour when BOINC starts computing. Must be set together with End Hour; setting only one of them, or setting both to the same time, is ignored"
  end_hour:
    name: End Hour
    description: "Configure the hour when BOINC stops computing. Must be set together with Start Hour; setting only one of them, or setting both to the same time, is ignored"
  max_ncpus:
    name: Max CPUs Percentage
    description: "Maximum percentage of CPUs to use while the computer is in use. Also applies while it is not in use, unless overridden below"
  cpu_usage_limit:
    name: Max CPU Usage Percentage
    description: "Maximum percentage of time each CPU can be used while the computer is in use. Also applies while it is not in use, unless overridden below"
  max_ncpus_idle:
    name: Max CPUs Percentage (Not In Use)
    description: "Maximum percentage of CPUs to use while the computer is not in use, instead of Max CPUs Percentage"
  cpu_usage_limit_idle:
    name: Max CPU Usage Percentage (Not In Use)
    description: "Maximum percentage of time each CPU can be used while the computer is not in use, instead of Max CPU Usage Percentage"
  disk_max_used_gb:
    name: Maximum Disk Space (GB)
    description: "Never use more than this many gigabytes for science data. Leave empty for no limit of this kind; whichever of the three disk limits is strictest wins"
  disk_max_used_pct:
    name: Maximum Disk Space (Percentage)
    description: "Never use more than this percentage of the total disk. Leave empty to keep BOINC's default of 90%; whichever of the three disk limits is strictest wins"
  disk_min_free_gb:
    name: Minimum Free Disk Space (GB)
    description: "Always leave at least this many gigabytes free. The safest of the three limits on a small machine, because it protects the disk rather than capping science data"
  work_buf_min_days:
    name: Minimum Work Buffer (Days)
    description: "How many days of work to keep queued, so computing continues while the internet is down. Larger buffers make backups bigger and risk missing deadlines"
  work_buf_additional_days:
    name: Additional Work Buffer (Days)
    description: "Extra days of work to fetch on top of the minimum, so BOINC asks for work less often. Set both to zero to download tasks only as they are needed"
network:
  31416/tcp: BOINC client GUI RPC port (default 31416)
