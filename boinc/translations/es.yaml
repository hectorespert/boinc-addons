configuration:
  projects:
    name: Proyectos
    description: "Los proyectos científicos para los que computar, cada uno con su dirección y tu clave de cuenta en él. No se puede combinar con las opciones del Gestor de Cuentas: si configuras ambas cosas, la app no arranca"
  gui_rpc_password:
    name: "Contraseña GUI RPC"
    description: "Contraseña para controlar este cliente BOINC de forma remota, por ejemplo desde boinctui. Configúrala si vas a conectarte de forma remota — consulta la documentación de la app para saber qué ocurre si la dejas vacía"
  remote_hosts:
    name: Hosts remotos
    description: Lista de hosts remotos para permitir la conexión remota
  allow_remote_gui_rpc:
    name: Permitir GUI RPC remota
    description: Permitir todas las conexiones GUI RPC remotas (Anula los hosts remotos)
  account_manager_url:
    name: URL del Gestor de Cuentas
    description: "URL de un Gestor de Cuentas BOINC, por ejemplo https://scienceunited.org. Configura las tres opciones del Gestor de Cuentas a la vez, o ninguna: si solo configuras algunas, la app no arranca"
  account_manager_username:
    name: Nombre de Usuario del Gestor de Cuentas
    description: "Nombre de usuario registrado en el Gestor de Cuentas BOINC. Obligatorio junto con las otras dos opciones del Gestor de Cuentas, o la app no arrancará"
  account_manager_password:
    name: Contraseña del Gestor de Cuentas
    description: "Contraseña del usuario configurado en el Gestor de Cuentas BOINC. Obligatoria junto con las otras dos opciones del Gestor de Cuentas, o la app no arrancará"
  start_hour:
    name: Hora de Inicio
    description: "Hora en que BOINC comienza a computar. Debe configurarse junto con Hora de Fin; si solo se pone una, o si ambas son iguales, se ignora"
  end_hour:
    name: Hora de Fin
    description: "Hora en que BOINC deja de computar. Debe configurarse junto con Hora de Inicio; si solo se pone una, o si ambas son iguales, se ignora"
  max_ncpus:
    name: Porcentaje Máximo de CPUs
    description: "Porcentaje máximo de CPUs a utilizar mientras el equipo está en uso. También se aplica cuando no está en uso, salvo que se indique lo contrario más abajo"
  cpu_usage_limit:
    name: Porcentaje Máximo de Uso de CPU
    description: "Porcentaje máximo de tiempo de uso de cada CPU mientras el equipo está en uso. También se aplica cuando no está en uso, salvo que se indique lo contrario más abajo"
  max_ncpus_idle:
    name: Porcentaje Máximo de CPUs (Sin Usar)
    description: "Porcentaje máximo de CPUs a utilizar mientras el equipo no está en uso, en lugar de Porcentaje Máximo de CPUs"
  cpu_usage_limit_idle:
    name: Porcentaje Máximo de Uso de CPU (Sin Usar)
    description: "Porcentaje máximo de tiempo que puede usarse cada CPU mientras el equipo no está en uso, en lugar de Porcentaje Máximo de Uso de CPU"
  disk_max_used_gb:
    name: Espacio Máximo en Disco (GB)
    description: "No usar nunca más de estos gigabytes para datos científicos. Vacío deja sin poner este límite; de los tres límites se aplica el más estricto"
  disk_max_used_pct:
    name: Espacio Máximo en Disco (Porcentaje)
    description: "No usar nunca más de este porcentaje del disco. Vacío mantiene el valor por defecto de BOINC, el 90%; de los tres límites se aplica el más estricto"
  disk_min_free_gb:
    name: Espacio Libre Mínimo en Disco (GB)
    description: "Dejar siempre libres al menos estos gigabytes. El más seguro de los tres en un equipo pequeño: protege el disco en vez de limitar los datos"
  work_buf_min_days:
    name: Reserva Mínima de Trabajo (Días)
    description: "Días de trabajo a mantener en cola, para seguir computando sin internet. Una reserva grande agranda las copias de seguridad y arriesga incumplir plazos"
  work_buf_additional_days:
    name: Reserva Adicional de Trabajo (Días)
    description: "Días de trabajo extra sobre el mínimo, para que BOINC pida trabajo menos a menudo. Pon ambos a cero para descargar tareas solo según hagan falta"
network:
  31416/tcp: Puerto GUI RPC del cliente BOINC (por defecto 31416)
