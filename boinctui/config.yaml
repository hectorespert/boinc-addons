name: boinctui
version: "2.5.0"
slug: boinctui
description: Fullscreen text mode manager for BOINC client
url: "https://github.com/hectorespert/boinc-addons/tree/main/boinctui"
arch:
  - aarch64
  - amd64
# Not for the documented reason ("the image has its own init system") — this one has none. ttyd is
# PID 1 and reaps its own children: run.sh execs into it, and each session is
# `bash -c "... exec boinctui"`, so the session process is a *direct* child of ttyd with no shell
# left in between. Measured 2026-08-16 — ten sessions opened and closed left no zombie — so Docker's
# init would add a process with nothing to collect.
init: false
ingress: true
ingress_port: 7681
panel_icon: mdi:console
image: "ghcr.io/hectorespert/addon-boinctui"
# `apparmor` defaults to true, and Supervisor loads apparmor.txt as the profile when the file is
# present, so neither is declared here -- the add-on linter rejects redeclaring a default.
backup: cold
